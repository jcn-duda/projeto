[package]
name = "adom-server"
version = "0.0.0"
edition = "2021"
publish = false
description = "Gateway HTTP do Adom. Com ROUTES_RUST vazio, só faz proxy para o Node."
license = "UNLICENSED"

[dependencies]
# Decisões puras do Chupim v3 (cascata, recheck, lote, dreno) consumidas pelo
# worker nativo do gateway.
adom-autofetch = { path = "../adom-autofetch" }
adom-core = { path = "../adom-core" }
adom-debrid = { path = "../adom-debrid" }
# Fila durável + worker do colhedor nativo (Fase 5).
adom-harvest = { path = "../adom-harvest" }
# `mag:v1` (lie/bad) do banco de magnets da conta — escrita do interrogatório
# de áudio (T3-L7a).
adom-index = { path = "../adom-index" }
adom-search = { path = "../adom-search" }
# Metadados nativos (C5): `MetaSources` + store do cache.db.
adom-sources = { path = "../adom-sources" }
adom-store = { path = "../adom-store" }
axum = { version = "0.8", features = ["json"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
# Serialização do snapshot do colhedor (`harvest/status.rs`) e das rotas.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
