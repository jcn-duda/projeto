[package]
name = "adom-sources"
version = "0.0.0"
edition = "2021"
publish = false
description = "Clientes Cinemeta/TMDB (B.1), Jackett (B.2), Prowlarr, Torrentio, BLUDV e Mico do Adom."
license = "UNLICENSED"

# Só deps que o workspace já usa: reqwest com rustls (sem OpenSSL), tokio e
# serde_json para o wire privado. O `adom-core` entra pelo path.
[dependencies]
adom-core = { path = "../adom-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Regex do título/parser BLUDV (mesma versão pinada do workspace). As classes
# `\b`/`\d` do JS são explícitas no código (`(?-u:\b)`), como no `adom-crawl`.
regex = "=1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# `Retry-After` em data HTTP (RFC 1123/850/asctime) — já vinha via reqwest.
httpdate = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
# Servidor HTTP de teste, o mesmo axum 0.8 dos outros crates.
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
