# Portão de regressão da suíte que já existe em test/. Roda sem rede: os testes
# trocam globalThis.fetch por dublê; nada aqui fala com Jackett, debrid ou com
# os sites BR.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Não interrompe a outra versão quando uma falha: o interessante costuma
      # ser justamente a diferença entre elas.
      fail-fast: false
      matrix:
        # 20 é o piso declarado em engines; 22 é o que a imagem de produção usa.
        # Em 20 o node:sqlite não existe e o cache cai só em memória — o teste de
        # persistência tem skip explícito pra isso, então as duas versões passam.
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Compila .ts → .js em dist/ e copia assets estáticos (src/public/).
      - name: Build
        run: npm run build

      # A lista do script `test` é explícita (glob no --test só a partir do
      # Node 21). Sem esta checagem, arquivo de teste novo fica de fora e o
      # verde do CI não quer dizer nada.
      - name: Todo teste está no npm test
        run: npm run test:complete

      - name: Testes
        run: npm test

      # Typecheck (tsc --noEmit) não depende da versão de runtime, então roda
      # só na 22 da matriz para não dobrar o tempo. Os .ts são checados por
      # padrão, com strictNullChecks e noImplicitAny ligados (portão em zero).
      - name: Verificar tipos
        if: matrix.node == '22.x'
        run: npm run typecheck

  # Fora do portão de propósito: com três dependências diretas, o audit falha
  # por transitiva alheia que não temos como corrigir, e um vermelho que sempre
  # aparece é um vermelho que ninguém mais lê. Aqui ele fica visível sem travar.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev

  # O build da imagem mora em .github/workflows/docker.yml: ele só precisa rodar
  # quando o Dockerfile e o que ele copia mudam, e filtro de caminho é por
  # workflow, não por job.
