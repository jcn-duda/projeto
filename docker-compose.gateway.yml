# OVERRIDE opt-in de validação local (commitado de propósito; o compose padrão
# não o carrega): liga o gateway Rust na 7000 com o Node na 7100 atrás.
# Default deste override: ROUTES_RUST=stream-shadow (Node responde; Rust
# remonta e só compara — sombra). Corte nativo (ROUTES_RUST=stream) é
# experimental: NÃO está pronto (evidência: BR some) e exige paridade
# BR+cotas antes de virar default. Não tratar smoke/validate-docker como
# aceite do corte. Rotas internas e reserva de debrid falam com o Node na
# 7100 — NUNCA :7000 (a fachada recusa /internal/*).
# Docs: docs/rust-stream-contract.md §0.
services:
  adom:
    environment:
      GATEWAY: "on"
      ROUTES_RUST: "stream-shadow"
      INTERNAL_SEARCH_URL: "http://127.0.0.1:7100"
      INTERNAL_CHECK_URL: "http://127.0.0.1:7100"
      # Sombra congelada: a 2ª request (X-Adom-Shadow-Frozen) roda sem
      # SWR/fast-path e grava o caso; o gateway compara Rust × ela.
      STREAM_FROZEN_MODE: "shadow"
      STREAM_FROZEN_SHADOW_BASE: "/tmp/adom-shadow"
