# OVERRIDE de DIAGNÓSTICO do corte nativo (`/stream` no gateway Rust).
#
# O corte nativo é o PADRÃO do `docker-compose.yml` (gateway na 7000, Node na
# 7100). Este arquivo NÃO liga nada e não muda flag nenhuma: ele só publica o
# Node em 127.0.0.1:7100 no host, para inspecionar o painel e as rotas
# internas/administrativas direto. O `/stream` do Node responde 410 nesse
# cenário — o diagnóstico de BUSCA é o `/metrics` do gateway.
#
# Rollback do corte é a IMAGEM/COMMIT anterior (o `/stream` do Node saiu do
# branch); não há env de rollback. Rotas internas e a reserva de debrid falam
# com o Node na 7100 — NUNCA :7000 (a fachada recusa /internal/*).
# Doc: docs/rust-stream-contract.md §0.
services:
  adom:
    ports:
      # Só para diagnóstico no host: o Node direto (painel/rotas internas).
      - "127.0.0.1:7100:7100"
