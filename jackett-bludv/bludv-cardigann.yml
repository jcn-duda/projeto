---
id: bludv-cardigann
name: Bludv
description: "BLUDV Filmes — torrents dublados e dual áudio em português"
language: pt-BR
type: public
encoding: UTF-8
requestDelay: 1
links:
  - https://bludvfilmes.xyz/

caps:
  categorymappings:
    # O site não distingue séries na página de busca; exponha seus posts para
    # ambas as categorias para que movie-search e tv-search não sejam filtrados.
    - {id: media, cat: Movies, desc: Movies and TV}
    - {id: media, cat: TV, desc: Movies and TV}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
  allowrawsearch: true

settings: []

# A busca roda no bludv-resolver (mesma rede Docker), que devolve uma página
# HTML sintética: cada post do WordPress vira N linhas, uma por botão
# Magnet-Link, com qualidade/áudio/tamanho reais daquele botão. O href de cada
# linha aponta para /resolve?url=<post>&i=<n>, que segue o protetor de links
# daquele botão exato e devolve o magnet como texto.
search:
  paths:
    - path: "http://addon:8700/search?q={{ .Query.Keywords }}"

  rows:
    selector: "div.posts > div.release"

  fields:
    title:
      selector: "div.title > a"
      filters:
        # Garantia dupla: o resolver já limpa o título; se sobrar rótulo "Torrent",
        # remove aqui para não atrapalhar quem casa o título com o nome do filme.
        - name: re_replace
          args: ["(?i)\\s*Torrent\\s*(?:[–-]|&#8211;)\\s*", " "]
        - name: re_replace
          args: ["(?i)\\s+Torrent\\b", ""]
    details:
      selector: "div.title > a"
      attribute: href
    download:
      selector: "div.title > a"
      attribute: href
    category:
      text: media
    size:
      selector: "div.size"
      optional: true
      filters:
        - name: regexp
          args: "([\\d.,]+\\s*(?:GB|MB|TB))"
        # O site usa vírgula decimal em alguns posts; o parser do Jackett quer ponto.
        - name: re_replace
          args: [",", "."]
    poster:
      selector: "div.poster img"
      attribute: src
      optional: true
    description:
      # Título original em inglês, útil pra identificar o filme na UI do Jackett.
      selector: "div.description"
      optional: true
    date:
      selector: "div.date"
      optional: true
      filters:
        - name: regexp
          args: "(\\d{2}/\\d{2}/\\d{4}).*"
        - name: dateparse
          args: "dd/MM/yyyy"
    seeders:
      # O BLUDV não publica seeds. Um valor neutro permite que clientes com
      # MIN_SEEDERS=1 não descartem a release antes de consultar o swarm.
      text: 1
    leechers:
      text: 0
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1

download:
  before:
    # O resolver segue os redirects do protetor do botão indicado em ?i= e
    # devolve o magnet como texto.
    path: "http://addon:8700/resolve"
    inputs:
      url: "{{ .DownloadUri.AbsoluteUri }}"
  selectors:
    - selector: body
      usebeforeresponse: true
      filters:
        - name: regexp
          args: "(magnet:.+)"
