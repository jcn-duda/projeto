# Workspace Rust da migração TS→Rust.
# `adom-core`: núcleo com lógica pura portada (18+ módulos) + golden.
# `adom-napi`: bindings NAPI-RS para o addon Node (cdylib).
# `adom-resolvers`: servidor HTTP dos resolvers BR (axum).
[workspace]
members = [
    "crates/adom-core",
    "crates/adom-napi",
    "crates/adom-crawl",
    "crates/adom-resolvers",
    "crates/adom-debrid",
    "crates/adom-server",
    # Orquestrador nativo do /stream (F1): parsing, SWR, build, glue
    # /internal/search/*. Consumido pelo adom-server quando ROUTES_RUST=stream.
    "crates/adom-search",
    # Harness de paridade do corpus `golden/stream-e2e`: lê o manifest, normaliza
    # (§9) e compara Node × Rust via `StreamSource` → `adom-search::orchestrator`.
    "crates/adom-parity",
    "crates/adom-sources",
    # Store SQLite de streams:v21 (SWR + cotas). Embrião Fase D — ainda não
    # pluga no Orchestrator/gateway.
    "crates/adom-store",
]
resolver = "2"

# A ponte NAPI captura panic; abort desligaria essa proteção do processo Node.
[profile.release]
panic = "unwind"
