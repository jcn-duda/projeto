[package]
name = "adom-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Núcleo Rust do Adom (fatia F0): consumo/integridade do golden, sem porte de matching."
license = "UNLICENSED"

# Nenhuma dependência de runtime: nenhuma API de matching é inventada aqui.
[dependencies]

[dev-dependencies]
# Só para os testes de integridade do golden (nunca entram no runtime):
serde = { version = "1", features = ["derive"] } # desserializa manifest/casos
serde_json = "1"                                  # parse do JSONL e do manifest
sha2 = "0.10"                                     # sha256 de corpus/saída, como no oracle Node
