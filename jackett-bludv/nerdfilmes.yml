---
id: nerdfilmes
name: NerdFilmesTorrent / XNerdFilmes
description: "NerdFilmesTorrent / XNerdFilmes — filmes e séries em português"
language: pt-BR
type: public
encoding: UTF-8
requestDelay: 3
links:
  - https://www.xnerdfilmes.net/

caps:
  categorymappings:
    - {id: media, cat: Movies, desc: Movies and TV}
    - {id: media, cat: TV, desc: Movies and TV}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
  allowrawsearch: true

settings: []

search:
  keywordsfilters:
    - name: re_replace
      args: ["[sS]\\d{1,2}(?:[eE]\\d{1,2})?", " "]
    - name: re_replace
      args: ["[:]+", " "]
    - name: re_replace
      args: ["\\s+", " "]
    - name: trim
  paths:
    - path: "http://127.0.0.1:8702/search?q={{ .Query.Keywords }}"

  rows:
    selector: "div.posts > div.release"

  fields:
    title:
      selector: "div.title > a"
    details:
      selector: "div.title > a"
      attribute: href
    download:
      selector: "div.title > a"
      attribute: href
    category:
      text: media
    poster:
      optional: true
      selector: "div.poster img"
      attribute: src
    size:
      selector: "div.size"
      optional: true
      filters:
        - name: regexp
          args: "([\\d.,]+\\s*(?:TB|GB|MB|KB))"
        - name: re_replace
          args: [",", "."]
    date:
      text: now
    seeders:
      text: 1
    leechers:
      text: 0
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1

# O resolver produz uma linha por botão/qualidade e preserva `i` até o magnet.
download:
  before:
    path: "http://127.0.0.1:8702/resolve"
    inputs:
      url: "{{ .DownloadUri.AbsoluteUri }}"
  selectors:
    - selector: body
      usebeforeresponse: true
      filters:
        - name: regexp
          args: "(magnet:\\?[^\\s\"'<>&]+)"
