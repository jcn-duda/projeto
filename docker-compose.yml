# Stack em CONTAINER ÚNICO: addon + Jackett + FlareSolverr + Caddy na mesma
# imagem (veja o Dockerfile multi-stage). Antes de expor, aponte
# adom.seudominio.com para a VPS e substitua o domínio no Caddyfile.
#
# Migração única vinda do compose multi-container antigo: o ServerConfig.json
# do Jackett vive no volume ./docker-data/jackett e ainda aponta o FlareSolverr
# pelo hostname antigo, que deixou de existir. Corrija uma vez:
#   sed -i 's#http://flaresolverr:8191#http://127.0.0.1:8191#' docker-data/jackett/Jackett/ServerConfig.json
services:
  adom:
    build: .
    container_name: stremio-adom
    restart: unless-stopped
    ports:
      # Caddy: HTTPS e o HTTP do challenge ACME.
      - "80:80"
      - "443:443"
      # Em casa: 0.0.0.0, pro Fire TV alcançar pela LAN (127.0.0.1 só serviria
      # a esta máquina). Na VPS: BIND_ADDR=127.0.0.1 no .env, senão o addon
      # responde em http://IP:7000 por fora do Caddy — e a URL de instalação
      # leva a chave do debrid no segmento de config, que fora do TLS vai em
      # texto puro e sobra em log de proxy.
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-7000}:7000"
      # Painéis só pra debug local; remova se não precisar.
      - "127.0.0.1:9117:9117"
      - "127.0.0.1:8191:8191"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 7000
      # Tudo vive no mesmo container agora: loopback no lugar do DNS do Docker.
      JACKETT_URL: http://127.0.0.1:9117
      PROWLARR_URL: http://127.0.0.1:9696
      BR_RESOLVERS_HOST: 127.0.0.1
      # Jackett (linuxserver) dentro do container único: sem auto-update pra
      # definição local BR não ser sobrescrita.
      AUTO_UPDATE: "false"
      TZ: America/Sao_Paulo
      # FlareSolverr. O addon NÃO lê esta: ele usa ADDON_LOG_LEVEL (no .env),
      # justamente porque aqui os três processos dividem um ambiente só.
      LOG_LEVEL: info
    volumes:
      # Cache em SQLite: sem isso ele zera a cada rebuild e toda busca volta
      # a esquentar do zero.
      - ./docker-data/addon:/app/data
      # Estado do Jackett (ServerConfig.json, Indexers/). As definitions
      # Cardigann vêm da IMAGEM — não monte nada em /app/Jackett/Definitions.
      - ./docker-data/jackett:/config
      - ./docker-data/downloads:/downloads
      # Certificados/config do Caddy (ACME). Os named volumes antigos
      # (caddy_data/caddy_config) não existem neste compose; pra preservar o
      # certificado, copie o conteúdo deles para ./docker-data/caddy antes.
      - ./docker-data/caddy:/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # O Chromium usa /dev/shm como memória compartilhada: o padrão de 64 MB do
    # Docker estoura em página pesada e a aba morre no meio do desafio, o que
    # chega ao addon como "tracker fora do ar".
    shm_size: 1gb
    # Antes o mem_limit isolava só o FlareSolverr; no container único o teto
    # cobre a stack inteira (~1 GB de Chromium + ~300 MB do resto). Estourando,
    # tudo reinicia via `restart` em vez do OOM killer escolher a vítima no host.
    mem_limit: 3g
