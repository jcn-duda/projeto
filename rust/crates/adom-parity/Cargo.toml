[package]
name = "adom-parity"
version = "0.0.0"
edition = "2021"
publish = false
description = "Harness de paridade do corpus stream-e2e: leitura, normalização determinística e diff legível."
license = "UNLICENSED"

# Costura com o orquestrador: `OrchestratorSource` / `FixtureOrchestratorSource`
# em `src/orchestrator_source.rs` (stubs ou fixtures meta/raw/debrid).
[dependencies]
adom-core = { path = "../adom-core" }
adom-search = { path = "../adom-search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[[bin]]
name = "adom-parity"
path = "src/main.rs"
