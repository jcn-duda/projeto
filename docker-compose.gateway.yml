# OVERRIDE opt-in de validação local (commitado de propósito; o compose padrão
# não o carrega): liga o gateway Rust na 7000 com o Node na 7100 atrás.
# ROUTES_RUST=stream-shadow: Node responde /stream; Rust só observa (sem corte
# nativo). Para o corte: ROUTES_RUST=stream (precisa rebuild do binário).
# Rotas internas e reserva de debrid falam com o Node na 7100 — NUNCA :7000
# (a fachada recusa /internal/*).
services:
  adom:
    environment:
      GATEWAY: "on"
      ROUTES_RUST: "stream"
      INTERNAL_SEARCH_URL: "http://127.0.0.1:7100"
      INTERNAL_CHECK_URL: "http://127.0.0.1:7100"
