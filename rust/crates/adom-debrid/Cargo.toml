[package]
name = "adom-debrid"
version = "0.0.0"
edition = "2021"
publish = false
description = "Cliente HTTP, estado e API interna do debrid (fase D0)."
license = "UNLICENSED"

[dependencies]
adom-core = { path = "../adom-core" }
# KV nativo (`cache.db`) para gravar a posse `adsub:v1` direto. Sem ciclo:
# o adom-index só depende do adom-core.
adom-index = { path = "../adom-index" }
# O contrato `AutofetchDebrid` NÃO entra como dependência: `adom-autofetch` →
# `adom-store` → `adom-search` → `adom-debrid` é ciclo de pacote (o Cargo
# recusa). O espelho fica em `src/autofetch_ports_contract.rs`.
regex = "=1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["json"] }
subtle = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
