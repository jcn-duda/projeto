---
id: torrentdosfilmesv2
name: TorrentDosFilmes V2
description: "TorrentDosFilmes V2 — filmes e séries torrent em português"
language: pt-BR
type: public
encoding: UTF-8
requestDelay: 1
links:
  - https://torrentdosfilmes-v2.xyz/

caps:
  categorymappings:
    - {id: media, cat: Movies, desc: Movies and TV}
    - {id: media, cat: TV, desc: Movies and TV}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
  allowrawsearch: true

settings: []

search:
  keywordsfilters:
    - name: re_replace
      args: ["[:]+", " "]
    - name: re_replace
      args: ["\\s+", " "]
    - name: trim
  paths:
    - path: "http://torrentdosfilmes-resolver:8703/search?q={{ .Query.Keywords }}"
  rows:
    selector: "div.posts > div.release"
  fields:
    title:
      selector: "div.title > a"
    details:
      selector: "div.title > a"
      attribute: href
    download:
      selector: "div.title > a"
      attribute: href
    category:
      text: media
    size:
      selector: "div.size"
      optional: true
      filters:
        - name: regexp
          args: "([\\d.,]+\\s*(?:TB|GB|MB|KB))"
        - name: re_replace
          args: [",", "."]
    date:
      text: now
    seeders:
      text: 1
    leechers:
      text: 0
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1

# O resolver expande cada botão como release separada e mantém `i` até o magnet.
download:
  before:
    path: "http://torrentdosfilmes-resolver:8703/resolve"
    inputs:
      url: "{{ .DownloadUri.AbsoluteUri }}"
  selectors:
    - selector: body
      usebeforeresponse: true
      filters:
        - name: regexp
          args: "(magnet:\\?[^\\s\"'<>]+)"
