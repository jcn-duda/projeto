# Workspace Rust da migração TS→Rust.
# `adom-core`: núcleo com lógica pura portada (18+ módulos) + golden.
# `adom-napi`: bindings NAPI-RS para o addon Node (cdylib).
# `adom-resolvers`: servidor HTTP dos resolvers BR (axum).
[workspace]
members = [
    "crates/adom-core",
    "crates/adom-napi",
    "crates/adom-crawl",
    "crates/adom-resolvers",
    "crates/adom-debrid",
    "crates/adom-server",
    # Embrião do orquestrador nativo do /stream (fatia F1.1 do lado Rust):
    # parsing de requisição + chave de cache + contrato da resposta. AINDA não
    # é consumido por ninguém; o /stream continua 100% Node.
    "crates/adom-search",
]
resolver = "2"

# A ponte NAPI captura panic; abort desligaria essa proteção do processo Node.
[profile.release]
panic = "unwind"
