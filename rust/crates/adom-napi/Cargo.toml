# Crate NAPI-RS: ponte entre o Node (ESM) e o `adom-core`.
#
# Este crate produz uma biblioteca dinâmica (.node) que o Node carrega via
# `require()`/`createRequire()`. Cada função pública é exposta com a macro
# `#[napi]`, que gera automaticamente os bindings C-ABI e o `.d.ts`.
#
# Regra de responsabilidade: este crate SÓ faz wrapping — toda lógica real
# vive em `adom-core`. Funções que dependem de segredo/config (p.ex.
# signResolve) recebem o segredo como parâmetro; o lado Node é responsável
# por fornecê-lo via `config`/`runtime`.

[package]
name = "adom-napi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bindings NAPI-RS do adom-core para o addon Node."
license = "UNLICENSED"

# Biblioteca dinâmica — o napi-rs precisa de cdylib para gerar o .node.
[lib]
crate-type = ["cdylib", "rlib"]

# Features de rede (reqwest/tokio) ficam atrás de `net` para que o .node
# compilado para o addon Node NÃO embarque o stack de rede do Rust. O .node
# só faz wrapping de `adom-core` (lógica pura) e `adom-crawl` (parsers puros).
# Quando adom-resolvers precisar de rede via napi, ative: `--features net`.
[features]
default = []
# `net` habilita deps de rede opcionais. Hoje o .node não usa rede;
# a feature existe para que futuros resolvers BR em Rust possam ser
# invocados via napi sem recompilar tudo.
net = []

[dependencies]
# Núcleo com as funções portadas (normalize_title, etc.).
adom-core = { path = "../adom-core" }
adom-crawl = { path = "../adom-crawl" }
# Dump JSON das cotas do cache (`cache.rs`): preserve_order para a ordem de
# inserção ser contrato, igual ao `config_encoding` do core.
serde_json = { version = "1", features = ["preserve_order"] }

# NAPI-RS: runtime + macro de export.
# "napi8" = API estável do Node 20+; "napi9" exigiria Node 22.
# "serde-json": streams/drops do ranking cruzam como serde_json::Value.
napi = { version = "2", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2"

[build-dependencies]
# Gera os bindings TypeScript e o loader JS durante o build.
napi-build = "2"
