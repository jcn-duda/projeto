<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 1.75rem; }
  .circle {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .circle svg { width: 30px; height: 30px; fill: #3aed86; margin-left: 4px; }
  .spinner {
    position: absolute; inset: -5px; border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #3aed67; border-right-color: rgb(58 237 88 / 30%);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { color: #ccc; font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500; min-width: 160px; text-align: center; }
  .track { width: 220px; height: 3px; background: #1e1e2a; border-radius: 99px; overflow: hidden; }
  .fill  { height: 100%; width: 0%; background: linear-gradient(90deg, #3aed71, #55f7c3); border-radius: 99px; }
</style>
