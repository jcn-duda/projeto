[package]
name = "adom-catalog"
version = "0.0.0"
edition = "2021"
publish = false
description = "Catálogo durável da conta do operador (catalog.db): linhas, varredura, dedup, limpeza e auditoria. Sem rede."
license = "UNLICENSED"

[dependencies]
adom-core = { path = "../adom-core" }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
