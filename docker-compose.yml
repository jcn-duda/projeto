# Stack em CONTAINER ÚNICO: addon + Jackett + FlareSolverr + Caddy na mesma
# imagem (veja o Dockerfile multi-stage). Antes de expor, aponte
# adom.seudominio.com para a VPS e substitua o domínio no Caddyfile.
#
# Migração única vinda do compose multi-container antigo: o ServerConfig.json
# do Jackett vive no volume ./docker-data/jackett e ainda aponta o FlareSolverr
# pelo hostname antigo, que deixou de existir. Corrija uma vez:
#   sed -i 's#http://flaresolverr:8191#http://127.0.0.1:8191#' docker-data/jackett/Jackett/ServerConfig.json
services:
  adom:
    build: .
    container_name: stremio-adom
    restart: unless-stopped
    ports:
      # Caddy: HTTPS e o HTTP do challenge ACME.
      - "80:80"
      - "443:443"
      # Em casa: 0.0.0.0, pro Fire TV alcançar pela LAN (127.0.0.1 só serviria
      # a esta máquina). Na VPS: BIND_ADDR=127.0.0.1 no .env, senão o addon
      # responde em http://IP:7000 por fora do Caddy — e a URL de instalação
      # leva a chave do debrid no segmento de config, que fora do TLS vai em
      # texto puro e sobra em log de proxy.
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-7000}:7000"
      # Painéis só pra debug local; remova se não precisar.
      - "127.0.0.1:9117:9117"
      - "127.0.0.1:8191:8191"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 7000
      # O gateway Rust é o caminho de PRODUÇÃO do `/stream` e não é modo
      # configurável: o entrypoint sobe `adom-server` na 7000 e o Node só na
      # 7100 (rotas internas/painel/efeitos do play). Desligar o gateway não é
      # modo de busca — rollback funcional é a imagem/commit anterior.
      GATEWAY: "on"
      ROUTES_RUST: "stream"
      # Worker NATIVO do Chupim (autofetch do gateway): `on` = o gateway é dono
      # do canal; `off`/vazio PARA o Chupim — kill-switch, não rollback (sem 2º dono).
      #
      # O default `on` mora AQUI (`${...:-on}`), não no código: `worker_enabled()`
      # no Rust só liga com a env valendo EXATAMENTE `on` (qualquer outro valor,
      # inclusive vazio, mantém o canal desligado). O `.env` da raiz alimenta a
      # interpolação abaixo E o `env_file` — nos dois caminhos `off` vence este
      # default, então `AUTOFETCH_WORKER=off` no `.env` desliga de verdade (vale
      # também exportar a variável no shell do deploy). Exige `up -d` (recriação):
      # `docker compose restart` NÃO relê o `.env`.
      #
      # Com `on` e `HttpClient` de pé o boot monta a fábrica dos cinco serviços
      # (`autofetch/build.rs` + `boot.rs`); o worker sobe
      # `enabled:true`/`phase:active` mesmo com ZERO contas no cofre
      # (`vaultAccounts:0`). Chave NÃO é requisito de boot: cada passo sem chave
      # é pulado com o motivo `no-credential` (o lote das outras contas segue) e
      # nenhum cenário de chave ausente derruba o processo. `phase:prepared`
      # significa outra coisa: o LAÇO não subiu (fábrica/`HttpClient` ausente).
      #
      # O cofre em RAM da chave (`autofetch/vault.rs`) vale desde o boot: chave
      # de usuário só em memória, nunca em KV, disco ou log.
      #
      # `EFFECTS_RUST` NÃO é fixado aqui de propósito: o default do código é ON
      # (`stream_config.rs`) e é ele que emite os kinds de trabalho. Desligá-lo
      # não devolve nada ao Node — com o `/stream` nativo ninguém emite, e o
      # Chupim para inteiro; ela é kill-switch, não rollback (este é commit/imagem).
      #
      # Confira o estado real com `scripts/check-autofetch.sh` (GET /autofetch
      # na admin de loopback 8711): `phase` distingue `active` de `prepared`
      # (laço não subiu) e de `paused` (botão do painel).
      AUTOFETCH_WORKER: "${AUTOFETCH_WORKER:-on}"
      # R3: a checagem/cache da AllDebrid é NATIVA e incondicional. HOLDS e
      # CLEANUP são os kill-switches das varreduras DESTRUTIVAS:
      #   DEBRID_AL_HOLDS=on ...... fatos in-process dos holds (calculados pelo gateway):
      #                             hold volátil + `adprot` + `knownBefore` + drops;
      #   DEBRID_AL_CLEANUP=on .... habilita o PLANO de limpeza, que só apaga com
      #                             `holdsComplete` + inventário (`may_delete`
      #                             fail-closed: sem snapshot, ninguém sai);
      #                             `DEBRID_AL_CLEANUP_KILL=on` é o kill-switch da fila.
      # Sem HOLDs+CLEANUP a nativa checa mas é READ-ONLY (a conta acumula
      # magnets até `MAGNET_TOO_MANY`); é o preço de não ligar limpeza cega.
      DEBRID_AL_HOLDS: "${DEBRID_AL_HOLDS:-on}"
      DEBRID_AL_CLEANUP: "${DEBRID_AL_CLEANUP:-on}"
      # Com o agendador do Node fora, a nativa é a DONA ÚNICA das quatro
      # varreduras destrutivas (mortos, não-dublados, reconcile da posse e a
      # cura da fila `sup:`); sem este gate a rodada fica READ-ONLY. O default
      # do CÓDIGO é OFF de propósito — quem sobe a limpeza é o compose. Rollback
      # das varreduras: `off` (read-only) ou a imagem/commit anterior.
      DEBRID_AL_SWEEP_APPLY: "${DEBRID_AL_SWEEP_APPLY:-on}"
      # O orquestrador nativo fala com o Node pelas rotas internas (loopback).
      INTERNAL_SEARCH_URL: "http://127.0.0.1:7100"
      # Tudo vive no mesmo container agora: loopback no lugar do DNS do Docker.
      JACKETT_URL: http://127.0.0.1:9117
      PROWLARR_URL: http://127.0.0.1:9696
      BR_RESOLVERS_HOST: 127.0.0.1
      # Sem default aqui de propósito: a URL e o container são UM interruptor
      # só, ambos no .env (DEBRID_RD_ORACLE_STREMTHRU_URL + COMPOSE_PROFILES=
      # stremthru). O available() do oráculo decide pela configuração, não por
      # alcançabilidade — URL setada com o container parado (profile off)
      # faria toda busca em RD pagar o prazo do oráculo num host morto. Fora
      # do compose o default do código também é vazio: nenhuma chave sai para
      # um terceiro sem configuração explícita.
      DEBRID_RD_ORACLE_STREMTHRU_URL: ${DEBRID_RD_ORACLE_STREMTHRU_URL:-}
      # Jackett (linuxserver) dentro do container único: sem auto-update pra
      # definição local BR não ser sobrescrita.
      AUTO_UPDATE: "false"
      TZ: America/Sao_Paulo
      # FlareSolverr. O addon NÃO lê esta: ele usa ADDON_LOG_LEVEL (no .env),
      # justamente porque aqui os três processos dividem um ambiente só.
      LOG_LEVEL: info
    volumes:
      # Cache em SQLite: sem isso ele zera a cada rebuild e toda busca volta
      # a esquentar do zero.
      - ./docker-data/addon:/app/data
      # Estado do Jackett (ServerConfig.json, Indexers/). As definitions
      # Cardigann vêm da IMAGEM — não monte nada em /app/Jackett/Definitions.
      - ./docker-data/jackett:/config
      - ./docker-data/downloads:/downloads
      # Certificados/config do Caddy (ACME). Os named volumes antigos
      # (caddy_data/caddy_config) não existem neste compose; pra preservar o
      # certificado, copie o conteúdo deles para ./docker-data/caddy antes.
      - ./docker-data/caddy:/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # O Chromium usa /dev/shm como memória compartilhada: o padrão de 64 MB do
    # Docker estoura em página pesada e a aba morre no meio do desafio, o que
    # chega ao addon como "tracker fora do ar".
    shm_size: 1gb
    # Antes o mem_limit isolava só o FlareSolverr; no container único o teto
    # cobre a stack inteira (~1 GB de Chromium + ~300 MB do resto). Estourando,
    # tudo reinicia via `restart` em vez do OOM killer escolher a vítima no host.
    mem_limit: 3g

  # Oráculo de disponibilidade do Real-Debrid, self-hosted (MIT, Go).
  # Container SEPARADO de propósito: o `adom` é a stack única com Caddy/Jackett
  # na mesma imagem, e o StremThru não tem nada a ver com aquele build.
  #
  # A API permanece self-hosted, mas o fallback abaixo usa conscientemente o
  # peer público para ampliar a cobertura. O StremThru encaminha a chave RD no
  # header X-StremThru-Store-Authorization ao peer em cada cache miss local.
  #
  # O banco começa VAZIO — no início ele responde `unknown` para quase tudo, o
  # que o parser trata como "não sei" (nunca miss). Ele esquenta com o uso.
  stremthru:
    # OPT-IN: só sobe com COMPOSE_PROFILES=stremthru no .env — e esse profile
    # anda PAR com DEBRID_RD_ORACLE_STREMTHRU_URL (mesmo interruptor; ver o
    # environment do adom). Serviço com profile inativo NÃO pode receber
    # depends_on: um depends_on para serviço fora do profile invalida o
    # projeto inteiro do compose (nem o adom sobe).
    profiles: ["stremthru"]
    # O Adom usa somente o check Torz como oráculo RD. Fixar a versão evita
    # upgrade silencioso e `STREMTHRU_FEATURE=torz` não sobe os workers de
    # catálogo/IMDB que reiniciavam o processo por heartbeat expirado.
    image: ghcr.io/muniftanjim/stremthru:0.103.2
    container_name: stremthru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/v0/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      # Só loopback: quem consome é o `adom`, pelo DNS interno do compose.
      # Publicado apenas para debug local (curl no host).
      - "127.0.0.1:8080:8080"
    environment:
      TZ: America/Sao_Paulo
      STREMTHRU_FEATURE: torz
      # Opt-in explícito: amplia a base de disponibilidade, aceitando que o peer
      # receba a credencial do store durante o fallback de hashes desconhecidos.
      STREMTHRU_PEER_URI: https://stremthru.13377001.xyz
      # Sem proxy auth: o único cliente é o addon, na rede interna do compose.
      STREMTHRU_AUTH: ""
      # A credencial do store viaja POR REQUISIÇÃO no header
      # X-StremThru-Store-Authorization; a instância não guarda chave nenhuma.
      STREMTHRU_STORE_AUTH: ""
      STREMTHRU_LOG_LEVEL: info
    volumes:
      # sqlite://./data/stremthru.db com WorkingDir /app (confirmado no
      # internal/config/config.go). Sem isto o banco zera a cada recreate e o
      # oráculo volta a responder `unknown` para tudo.
      - ./docker-data/stremthru:/app/data
    mem_limit: 512m
