---
id: bludv-cardigann
name: Bludv
description: "BLUDV Filmes — torrents dublados e dual áudio em português"
language: pt-BR
type: public
encoding: UTF-8
requestDelay: 3
links:
  - https://bludvfilmes.xyz/

caps:
  categorymappings:
    # O site não distingue séries na página de busca; exponha seus posts para
    # ambas as categorias para que movie-search e tv-search não sejam filtrados.
    - {id: media, cat: Movies, desc: Movies and TV}
    - {id: media, cat: TV, desc: Movies and TV}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
  allowrawsearch: true

settings: []

# Cada resultado é um post do WordPress. No download, o resolver escolhe o
# MELHOR botão Magnet-Link do post (dublado/dual, maior qualidade) e o segue
# até a página final, cujo JavaScript contém o magnet.
search:
  paths:
    - path: "?s={{ .Keywords }}"

  rows:
    selector: "div.posts > div.post"

  fields:
    title:
      selector: "div.title > a"
      filters:
        # "Coringa Torrent – BluRay ..." → "Coringa BluRay ...": o rótulo
        # "Torrent" só atrapalha quem casa o título com o nome do filme.
        - name: re_replace
          args: ["(?i)\\s*Torrent\\s*(?:[–-]|&#8211;)\\s*", " "]
        - name: re_replace
          args: ["(?i)\\s+Torrent\\b", ""]
    details:
      selector: "div.title > a"
      attribute: href
    download:
      selector: "div.title > a"
      attribute: href
    category:
      text: media
    size:
      # "Tamanho: 2.49 GB" no bloco de informações do card de busca.
      selector: "div.content"
      optional: true
      filters:
        - name: regexp
          args: "Tamanho:(?:[^0-9]{0,200})([\\d.,]+\\s*(?:GB|MB|TB))"
        # O site usa vírgula decimal em alguns posts; o parser do Jackett quer ponto.
        - name: re_replace
          args: [",", "."]
    poster:
      selector: "div.content img"
      attribute: src
      optional: true
    description:
      # Título original em inglês, útil pra identificar o filme na UI do Jackett.
      selector: "div.content"
      optional: true
      filters:
        - name: regexp
          args: "Título Original:(?:\\s*</?[a-zA-Z]+[^>]*>)*\\s*([^<\\n]+)"
    date:
      selector: ".icon .infos"
      filters:
        - name: regexp
          args: "(\\d{2}/\\d{2}/\\d{4}).*"
        - name: dateparse
          args: "dd/MM/yyyy"
    seeders:
      # O BLUDV não publica seeds. Um valor neutro permite que clientes com
      # MIN_SEEDERS=1 não descartem a release antes de consultar o swarm.
      text: 1
    leechers:
      text: 0
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1

download:
  before:
    # O resolver segue os redirects do protetor e devolve o magnet como texto.
    path: "http://bludv-resolver:8700/resolve"
    inputs:
      url: "{{ .DownloadUri.AbsoluteUri }}"
  selectors:
    - selector: body
      usebeforeresponse: true
      filters:
        - name: regexp
          args: "(magnet:.+)"
