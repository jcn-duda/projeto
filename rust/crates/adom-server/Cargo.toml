[package]
name = "adom-server"
version = "0.0.0"
edition = "2021"
publish = false
description = "Servidor HTTP do Adom na 7000: rotas Rust e, com GATEWAY_UPSTREAM, proxy para o Node."
license = "UNLICENSED"

[dependencies]
axum = { version = "0.8", features = ["json"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
adom-crawl = { path = "../adom-crawl" }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
serde_json = "1"
